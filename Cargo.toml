[workspace]
members = ["libtgrs", "tgrs"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Gigas002/tgrs"
description = "A simple TUI for Telegram"
keywords = ["telegram", "tui", "tdlib"]
repository = "https://github.com/Gigas002/tgrs"
version = "1.0.0"

[workspace.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyring-core = "1"
notify-rust = "4"
nucleo-matcher = "0.3"
ratatui = "0.30"
ratatui-explorer = "0.3"
ratatui-image = { version = "11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tdlib-rs = { git = "https://github.com/Gigas002/tdlib-rs" }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "registry",
  "std",
] }
unicode-width = "0.2"

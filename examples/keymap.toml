# The core_window key bindings are usable in any app component.
[core_window]
keymap = [
  # Quit the application, example of multiple keys
  # { keys = ["w", "w"], command = "quit", description = "Quit the application"},

  # Quit the application
  # Note: The prompt effective keymap automatically filters out inherited
  # "try_quit" bindings so that "q" is typed as text while the prompt is focused.
  # To re-enable "q" as quit in the prompt, explicitly bind it in the [prompt] section.
  { keys = ["q"], command = "try_quit", description = "Quit the application"},
  # Quit the application
  { keys = ["ctrl+c"], command = "try_quit", description = "Quit the application"},
  # Focus the chat list
  { keys = ["alt+1"], command = "focus_chat_list", description = "Focus the chat list"},
  # Focus the chat
  { keys = ["alt+2"], command = "focus_chat", description = "Focus the chat"},
  # Focus the prompt
  { keys = ["alt+3"], command = "focus_prompt", description = "Focus the prompt"},
  # Close a popup or leave the prompt for the chat; a pane always keeps the focus
  { keys = ["esc"], command = "unfocus_component", description = "Close the popup or leave the prompt"},
  # Resize the focused pane, like concord: wider, narrower, taller, shorter
  { keys = ["alt+right"], command = "resize_pane_wider", description = "Make the focused pane wider"},
  { keys = ["alt+left"], command = "resize_pane_narrower", description = "Make the focused pane narrower"},
  { keys = ["alt+up"], command = "resize_pane_taller", description = "Make the focused pane taller"},
  { keys = ["alt+down"], command = "resize_pane_shorter", description = "Make the focused pane shorter"},
  # Open the leader menu, like concord: then e.g. 1 hides or shows the chat list
  { keys = ["space"], command = "show_leader_menu", description = "Open the leader menu"},
  # Toggle chat_list visibility
  { keys = ["alt+n"], command = "toggle_chat_list", description = "Toggle chat_list visibility"},
  # Focus the archived chats, showing them
  { keys = ["alt+a"], command = "focus_archive_list", description = "Focus the archived chats"},
  # Toggle archive_list visibility
  { keys = ["alt+b"], command = "toggle_archive_list", description = "Toggle archive_list visibility"},
  # Focus the topics of the open group with topics (forum)
  { keys = ["alt+t"], command = "focus_topic_list", description = "Focus the topic list"},
  # Toggle topic_list visibility; it is only shown for groups with topics
  { keys = ["alt+m"], command = "toggle_topic_list", description = "Toggle topic_list visibility"},
  # Increase the chat list size
  { keys = ["alt+l"], command = "increase_chat_list_size", description = "Increase the chat list size"},
  # Decrease the chat list size
  { keys = ["alt+h"], command = "decrease_chat_list_size", description = "Decrease the chat list size"},
  # Increase the prompt size
  { keys = ["alt+k"], command = "increase_prompt_size", description = "Increase the prompt size"},
  # Decrease the prompt size
  { keys = ["alt+j"], command = "decrease_prompt_size", description = "Decrease the prompt size"},
  # Start chat list search (when nothing is selected)
  { keys = ["alt+r"], command = "chat_list_search", description = "Start searching chats"},
  # Show command guide with keybindings
  { keys = ["alt+f1"], command = "show_command_guide", description = "Show command guide with all keybindings"},

  # Pick a sticker to send to the open chat
  { keys = ["alt+s"], command = "show_sticker_picker", description = "Send a sticker"},
  # Upload file (opens the file explorer popup)
  { keys = ["alt+u"], command = "show_file_upload_explorer", description = "Upload file"},
]

# The chat_list key bindings are only usable in the chat list component.
# When the chat list is focused, core_window bindings apply too (e.g. Alt+1/2/3, Esc).
# Only list bindings specific to the chat list here.
[chat_list]
keymap = [
  # Select the next chat
  { keys = ["down"], command = "chat_list_next", description = "Select the next chat"},
  # Select the previous chat
  { keys = ["up"], command = "chat_list_previous", description = "Select the previous chat"},
  # Move to the chat, like concord (Enter opens the selected chat)
  { keys = ["right"], command = "focus_next_pane", description = "Focus the chat"},
  # Open the selected chat
  { keys = ["enter"], command = "chat_list_open", description = "Open the selected chat"},
  # Move focus to the prompt and set its state to receive a string used to order the entries in the chat list window.
  { keys = ["alt+r"], command = "chat_list_search", description = "Focus on prompt to start searching"},
  # Restore the default sorting in the chat list window.
  { keys = ["alt+c"], command = "chat_list_restore_sort", description = "Restore the default ordering of the chat list"},
  # Chat actions on the selected chat: a lists them, the others run one
  { keys = ["a"], command = "show_chat_actions", description = "Open chat actions"},
  { keys = ["m"], command = "toggle_chat_mute", description = "Mute or unmute the chat"},
  { keys = ["A"], command = "toggle_chat_archive", description = "Archive or unarchive the chat"},
  { keys = ["P"], command = "toggle_chat_pin", description = "Pin or unpin the chat"},
  { keys = ["u"], command = "toggle_chat_read", description = "Mark the chat as read or unread"},
  { keys = ["D"], command = "leave_chat", description = "Leave or delete the chat (press twice)"},
  { keys = ["B"], command = "toggle_chat_block", description = "Block or unblock the person"},
  # Move the selected pinned chat up or down among the pinned chats
  { keys = ["K"], command = "move_chat_up", description = "Move the pinned chat up"},
  { keys = ["shift+up"], command = "move_chat_up", description = "Move the pinned chat up"},
  { keys = ["J"], command = "move_chat_down", description = "Move the pinned chat down"},
  { keys = ["shift+down"], command = "move_chat_down", description = "Move the pinned chat down"},
  { keys = ["!"], command = "report_chat", description = "Report the chat"},
  # The profile of the selected chat: a person's bio and usernames, a group's description
  { keys = ["i"], command = "show_profile", description = "Show the chat's profile"},
  # Open a chat by its public username, e.g. @durov or a t.me link
  { keys = ["n"], command = "show_find_chat", description = "Open a chat by username"},
  # Open pinned messages for the current chat (no-op if none pinned).
  { keys = ["shift+back_tab"], command = "show_pinned_messages_popup", description = "Open pinned messages for the open chat"},
  { keys = ["back_tab"], command = "show_pinned_messages_popup", description = "Open pinned messages for the open chat"},
]

# The archive_list key bindings are only usable in the archived chats, shown
# right of the chat list after opening its "Archived chats" row.
[archive_list]
keymap = [
  { keys = ["down"], command = "archive_list_next", description = "Select the next archived chat"},
  { keys = ["up"], command = "archive_list_previous", description = "Select the previous archived chat"},

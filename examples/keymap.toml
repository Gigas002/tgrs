  { keys = ["enter"], command = "archive_list_open", description = "Open the selected archived chat"},
  # Chat actions on the selected chat: a lists them, the others run one
  { keys = ["a"], command = "show_chat_actions", description = "Open chat actions"},
  { keys = ["m"], command = "toggle_chat_mute", description = "Mute or unmute the chat"},
  { keys = ["A"], command = "toggle_chat_archive", description = "Archive or unarchive the chat"},
  { keys = ["P"], command = "toggle_chat_pin", description = "Pin or unpin the chat"},
  { keys = ["u"], command = "toggle_chat_read", description = "Mark the chat as read or unread"},
  { keys = ["D"], command = "leave_chat", description = "Leave or delete the chat (press twice)"},
  { keys = ["B"], command = "toggle_chat_block", description = "Block or unblock the person"},
  # Move the selected pinned chat up or down among the pinned chats
  { keys = ["K"], command = "move_chat_up", description = "Move the pinned chat up"},
  { keys = ["shift+up"], command = "move_chat_up", description = "Move the pinned chat up"},
  { keys = ["J"], command = "move_chat_down", description = "Move the pinned chat down"},
  { keys = ["shift+down"], command = "move_chat_down", description = "Move the pinned chat down"},
  { keys = ["!"], command = "report_chat", description = "Report the chat"},
  # The profile of the selected chat: a person's bio and usernames, a group's description
  { keys = ["i"], command = "show_profile", description = "Show the chat's profile"},
  # Open a chat by its public username, e.g. @durov or a t.me link
  { keys = ["n"], command = "show_find_chat", description = "Open a chat by username"},
  { keys = ["shift+back_tab"], command = "show_pinned_messages_popup", description = "Open pinned messages for the open chat"},
  { keys = ["back_tab"], command = "show_pinned_messages_popup", description = "Open pinned messages for the open chat"},
]

# The topic_list key bindings are only usable in the topic list, shown right of
# the chat list when the open chat is a group with topics (a forum).
[topic_list]
keymap = [
  { keys = ["down"], command = "topic_list_next", description = "Select the next topic"},
  { keys = ["up"], command = "topic_list_previous", description = "Select the previous topic"},
  { keys = ["left"], command = "focus_previous_pane", description = "Focus the chat list"},
  { keys = ["right"], command = "focus_next_pane", description = "Focus the chat"},
  { keys = ["enter"], command = "topic_list_open", description = "Open the selected topic"},
  { keys = ["shift+back_tab"], command = "show_pinned_messages_popup", description = "Open pinned messages for the open topic"},
  { keys = ["back_tab"], command = "show_pinned_messages_popup", description = "Open pinned messages for the open topic"},
]

# The chat key bindings are only usable in the chat component.
# When the chat is focused, core_window bindings apply too. Only list chat-specific bindings here.
[chat]
keymap = [
  # Select the next message (older, toward top of list)
  { keys = ["up"], command = "chat_window_next", description = "Select the previous message (up)"},
  # Select the previous message (newer, toward bottom of list)
  { keys = ["down"], command = "chat_window_previous", description = "Select the next message (down)"},
  # Move to the chat list or the prompt, like concord
  { keys = ["left"], command = "focus_previous_pane", description = "Focus the chat list"},
  { keys = ["right"], command = "focus_next_pane", description = "Focus the prompt"},
  # Write a message, like concord
  { keys = ["i"], command = "focus_prompt", description = "Write a message"},
  # Delete the selected message for all users
  { keys = ["d"], command = "chat_window_delete_for_everyone", description = "Delete the selected message for all users"},
  # Delete the selected message for "me"
  { keys = ["D"], command = "chat_window_delete_for_me", description = "Delete the selected message for 'me'"},
  # Copy the selected message
  { keys = ["y"], command = "chat_window_copy", description = "Copy the selected message"},
  # Copy the selected message (overrides core_window try_quit when chat focused)
  { keys = ["ctrl+c"], command = "chat_window_copy", description = "Copy the selected message"},
  # Edit the selected message
  { keys = ["e"], command = "chat_window_edit", description = "Edit the selected message"},
  # Reply to the selected message
  { keys = ["R"], command = "chat_window_reply", description = "Reply to the selected message"},
  # Add or remove a reaction on the selected message
  { keys = ["r"], command = "react_message", description = "React to the selected message"},
  # Open a link of the selected message in the browser (picked when there are several)
  { keys = ["o"], command = "open_message_url", description = "Open a URL of the selected message"},
  # Select the message the selected one replies to
  { keys = ["g"], command = "go_to_replied_message", description = "Go to the replied message"},
  # Pin the selected message for everyone, or unpin it
  { keys = ["P"], command = "toggle_message_pin", description = "Pin or unpin the selected message"},
  # Copy the link of the selected message (supergroups and channels)
  { keys = ["L"], command = "copy_message_link", description = "Copy the message link"},
  # Report the selected message to Telegram's moderators
  { keys = ["!"], command = "report_message", description = "Report the selected message"},
  { keys = ["f"], command = "forward_message", description = "Forward the selected message"},
  # Open the actions menu of the selected message
  { keys = ["enter"], command = "show_message_actions", description = "Open message actions"},
  # Open the media (photo, video, GIF, audio, voice, file, ...) in its default application, e.g. mpv
  { keys = ["x"], command = "open_message_media", description = "Open media in the default application"},
  # Save the media or file to the download directory (app.download_dir)
  { keys = ["s"], command = "download_message_media", description = "Download media or file"},
  # Move focus to the prompt and set its state to search messages in the chat window.
  { keys = ["alt+r"], command = "chat_window_search", description = "Focus on prompt to start searching messages"},
  # Restore the default message ordering in the chat window.
  { keys = ["alt+c"], command = "chat_window_restore_sort", description = "Restore the default ordering of messages"},
  # Open pinned messages popup (when the chat has pinned messages).
  { keys = ["shift+back_tab"], command = "show_pinned_messages_popup", description = "Open pinned messages browser"},
  { keys = ["back_tab"], command = "show_pinned_messages_popup", description = "Open pinned messages browser"},
]

# The prompt key bindings are only usable in the prompt component.
# When the prompt is focused, core_window bindings apply too (e.g. Alt+1/2/3, Esc).
# Only list prompt-specific bindings here.
[prompt]
keymap = [
  # Send the current message, edit, reply, or search. Shift/Ctrl/Alt+Enter or
  # Ctrl+J insert a newline (Shift+Enter and Ctrl+Enter only in terminals that
  # report them, e.g. with the kitty keyboard protocol).
  { keys = ["enter"], command = "prompt_send_message", description = "Send the message"},
  # Copy the selected text (overrides core_window try_quit when prompt focused)
  { keys = ["ctrl+c"], command = "prompt_copy", description = "Copy the selected text"},
  # Attach the image on the clipboard (needs the media-preview feature)
  { keys = ["alt+v"], command = "prompt_paste_image", description = "Paste an image from the clipboard"},
  # The next message, file or sticker arrives without sound (once)
  { keys = ["alt+q"], command = "prompt_toggle_silent", description = "Send the next message without sound"},
  # Open message search overlay (same as Alt+R in chat section)
  { keys = ["alt+r"], command = "chat_window_search", description = "Open message search overlay"},
]

# The command_guide key bindings are only usable when the command guide popup is focused.
# When the command guide is focused, core_window bindings apply too (e.g. Alt+1/2/3).
# Only list command guide-specific bindings here.
[command_guide]
keymap = [
  # Close the command guide popup
  { keys = ["esc"], command = "hide_command_guide", description = "Close the command guide"},
  { keys = ["f1"], command = "hide_command_guide", description = "Close the command guide"},
]

# The search_overlay key bindings are only usable when the search overlay popup is focused.
# When the search overlay is focused, core_window bindings apply too (e.g. Alt+1/2/3).
# Only list search overlay-specific bindings here.
[search_overlay]
keymap = [
  # Close the search overlay popup
  { keys = ["esc"], command = "close_search_overlay", description = "Close the search overlay"},
  # Submit search query (when no results) or confirm selection and jump (when results exist)
  { keys = ["enter"], command = "search_overlay_submit", description = "Submit search or confirm selection"},
]

# The message_actions key bindings are only usable when the message actions menu is open.
# Besides these, the chat keys of each action (e.g. "e" to edit) run it directly.
# The chat actions menu opens with a in the chat list and the archive (the
# selected chat) or space c (the open chat). The chat list keys of an action,
# like m to mute, run it directly; leaving or deleting a chat asks to confirm.
[chat_actions]
keymap = [
  { keys = ["esc"], command = "hide_chat_actions", description = "Close chat actions"},
  { keys = ["q"], command = "hide_chat_actions", description = "Close chat actions"},
  { keys = ["enter"], command = "chat_actions_confirm", description = "Run the highlighted action"},
  { keys = ["up"], command = "chat_actions_previous", description = "Previous action"},
  { keys = ["k"], command = "chat_actions_previous", description = "Previous action"},
  { keys = ["down"], command = "chat_actions_next", description = "Next action"},
  { keys = ["j"], command = "chat_actions_next", description = "Next action"},
]

# The find_chat key bindings are only usable in the popup that opens a chat by
# its username (n in the chat list, space n elsewhere); other keys type.
[find_chat]
keymap = [
  { keys = ["esc"], command = "hide_find_chat", description = "Close without opening a chat"},
  { keys = ["enter"], command = "find_chat_confirm", description = "Open the chat of the username"},
]

# The report key bindings are only usable while reporting a chat (! in the
# chat list) or a message (! in the chat): pick a reason (1-9 pick directly,
# j/k move), then write details if Telegram asks; other keys type.
[report]
keymap = [
  { keys = ["esc"], command = "hide_report", description = "Stop reporting"},
  { keys = ["enter"], command = "report_confirm", description = "Pick the reason or send the details"},
  { keys = ["up"], command = "report_previous", description = "Previous reason"},
  { keys = ["down"], command = "report_next", description = "Next reason"},
]

# The blocked_list key bindings are only usable in the list of blocked users
# (space b).
[blocked_list]
keymap = [
  { keys = ["esc"], command = "hide_blocked_list", description = "Close the blocked list"},
  { keys = ["q"], command = "hide_blocked_list", description = "Close the blocked list"},
  { keys = ["u"], command = "blocked_list_unblock", description = "Unblock"},
  { keys = ["enter"], command = "blocked_list_unblock", description = "Unblock"},
  { keys = ["up"], command = "blocked_list_previous", description = "Previous"},
  { keys = ["k"], command = "blocked_list_previous", description = "Previous"},
  { keys = ["down"], command = "blocked_list_next", description = "Next"},
  { keys = ["j"], command = "blocked_list_next", description = "Next"},
]

# The forward key bindings are only usable while picking the chat to forward
# a message to (f in the chat); other keys type to find the chat.
[forward]
keymap = [
  { keys = ["esc"], command = "hide_forward", description = "Close without forwarding"},
  { keys = ["enter"], command = "forward_confirm", description = "Forward to the highlighted chat"},
  { keys = ["down"], command = "forward_next", description = "Next chat"},
  { keys = ["ctrl+n"], command = "forward_next", description = "Next chat"},
  { keys = ["up"], command = "forward_previous", description = "Previous chat"},

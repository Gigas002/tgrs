# The profile key bindings are only usable while a profile is shown: i in the
# chat list and the archive (the selected chat), space i (the open chat) or
# space m (your own).
[profile]
keymap = [
  { keys = ["esc"], command = "hide_profile", description = "Close the profile"},
  { keys = ["q"], command = "hide_profile", description = "Close the profile"},
  { keys = ["i"], command = "hide_profile", description = "Close the profile"},

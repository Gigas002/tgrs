# The leader menu opens with Space (see [core_window]) and lists these keys; the
# pressed key runs its command and closes the menu, any other key just closes it.
# Like concord, the pane numbers toggle panes: 1 hides or shows the chat list.
[leader_menu]
keymap = [
  { keys = ["1"], command = "toggle_chat_list", description = "Toggle the chat list"},
  { keys = ["2"], command = "toggle_topic_list", description = "Toggle the topic list"},
  { keys = ["3"], command = "toggle_archive_list", description = "Toggle the archived chats"},
  { keys = ["a"], command = "show_message_actions", description = "Actions of the selected message"},
  { keys = ["space"], command = "chat_list_search", description = "Search chats"},
  { keys = ["/"], command = "chat_window_search", description = "Search messages"},
  { keys = ["p"], command = "show_pinned_messages_popup", description = "Pinned messages"},
  { keys = ["u"], command = "show_file_upload_explorer", description = "Upload a file"},
  { keys = ["s"], command = "show_sticker_picker", description = "Send a sticker"},
  { keys = ["c"], command = "show_chat_actions", description = "Actions of the open chat"},

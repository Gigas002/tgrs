# The picker key bindings are only usable when the reaction or URL picker is open.
# Besides these, 1-9 and 0 pick the first ten entries directly.
[picker]
keymap = [
  { keys = ["esc"], command = "hide_picker", description = "Close the picker"},
  { keys = ["q"], command = "hide_picker", description = "Close the picker"},
  { keys = ["enter"], command = "picker_confirm", description = "Pick the highlighted entry"},
  { keys = ["up"], command = "picker_previous", description = "Previous entry"},
  { keys = ["k"], command = "picker_previous", description = "Previous entry"},
  { keys = ["down"], command = "picker_next", description = "Next entry"},
  { keys = ["j"], command = "picker_next", description = "Next entry"},
]

# The sticker_picker key bindings are only usable while the sticker picker is
# open: arrows (or h/j/k/l) pick a sticker, tab and shift+tab switch sets.
[sticker_picker]
keymap = [
  { keys = ["esc"], command = "hide_sticker_picker", description = "Close the sticker picker"},
  { keys = ["q"], command = "hide_sticker_picker", description = "Close the sticker picker"},
  { keys = ["enter"], command = "sticker_picker_send", description = "Send the selected sticker"},
  { keys = ["left"], command = "sticker_picker_left", description = "Previous sticker"},
  { keys = ["h"], command = "sticker_picker_left", description = "Previous sticker"},
  { keys = ["right"], command = "sticker_picker_right", description = "Next sticker"},
  { keys = ["l"], command = "sticker_picker_right", description = "Next sticker"},
  { keys = ["up"], command = "sticker_picker_up", description = "Sticker above"},
  { keys = ["k"], command = "sticker_picker_up", description = "Sticker above"},
  { keys = ["down"], command = "sticker_picker_down", description = "Sticker below"},
  { keys = ["j"], command = "sticker_picker_down", description = "Sticker below"},
  { keys = ["tab"], command = "sticker_picker_next_set", description = "Next sticker set"},
  { keys = ["back_tab"], command = "sticker_picker_previous_set", description = "Previous sticker set"},
  { keys = ["shift+back_tab"], command = "sticker_picker_previous_set", description = "Previous sticker set"},
]

[file_upload_explorer]
keymap = [
  # Close the file upload explorer popup
  { keys = ["esc"], command = "hide_file_upload_explorer", description = "Close file upload explorer"},
  { keys = ["q"], command = "hide_file_upload_explorer", description = "Close file upload explorer"},
]


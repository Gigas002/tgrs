# tgt configuration.
#
# Location: $XDG_CONFIG_HOME/tgt/config.toml (default ~/.config/tgt/config.toml),
# or the directory given by `--config-dir` / `TGT_CONFIG_DIR`.
# Every key is optional; commented-out values are the defaults.
# Paths may start with `~`; relative paths are rejected.

[app]
# Mouse support in the terminal.
# mouse_support = true
# Bracketed paste support in the terminal.
# paste_support = true
# Frames per second. Lower values reduce CPU usage when idle
# (120 ultra smooth, 60 smooth, 30 balanced, 15 battery saving).
# frame_rate = 60.0
# Show the status bar at the bottom of the terminal.
# show_status_bar = true
# Show the title bar at the top of the terminal.
# show_title_bar = true
# Use emoji for message status (edited, reply, sent, seen) instead of
# ASCII indicators ([edited], <-- reply, [✓] sent, [o o] seen).
# use_emoji_icons = false
# Directory where downloaded media and files are saved
# (default $XDG_DOWNLOAD_DIR, else ~/Downloads).
# download_dir = "~/Downloads"

[logger]
# off, error, warn, info, debug or trace. Overridden by `--log-level`, `-v`, `-q`.
# level = "info"
# Log directory (default $XDG_STATE_HOME/tgt/logs). Overridden by `--log-dir`.
# dir = "~/.local/state/tgt/logs"
# Log file rotation: minutely, hourly, daily or never.
# rotation = "daily"
# Number of rotated log files to keep.
# keep = 7

[telegram]
# Telegram API credentials from https://my.telegram.org.
# Overridden by the API_ID and API_HASH environment variables.
# api_id = 94575
# api_hash = "a3406de8d171bb422bb6ddf3bbd800e2"
# TDLib database directory (default $XDG_DATA_HOME/tgt/tdlib).
# database_dir = "~/.local/share/tgt/tdlib"
# Keep information about downloaded and uploaded files between restarts.
# use_file_database = true
# Keep users, groups, channels and secret chats between restarts.
# use_chat_info_database = true
# Keep chats and messages between restarts.
# use_message_database = true
# IETF language tag of the system language.
# system_language_code = "en"
# Device model reported to Telegram.
# device_model = "Desktop"
# TDLib log verbosity: 0 fatal, 1 errors, 2 warnings, 3 info, 4 debug, 5 verbose.
# log_verbosity = 2
# TDLib log file (default $XDG_STATE_HOME/tgt/tdlib.log).
# log_path = "~/.local/state/tgt/tdlib.log"
# Also redirect stderr to the TDLib log.
# log_redirect_stderr = false

# Optional proxy for connecting to Telegram; ignored without `server`.
# [telegram.proxy]
# socks5, http or mtproto.
# type = "socks5"
# server = "127.0.0.1"
# port = 1080
# SOCKS5/HTTP credentials.
# username = ""
# password = ""
# HTTP only: the proxy handles only HTTP requests (no CONNECT tunneling).
# http_only = false
# MTProto only: hex-encoded secret.
# secret = ""

[credentials]
# Where the key of the encrypted TDLib database (your login session) is kept:
#   auto     - the system keychain (Secret Service) when available, otherwise
#              the database is left unencrypted;
#   keychain - only the system keychain; tgt refuses to start without it;
#   plain    - no keychain, the database is not encrypted.
# Switching an encrypted database to `plain` requires logging in again.
# store = "auto"

[notifications]
# Desktop notifications for new messages. Muted chats stay silent, and the
# open chat is never notified about.
# enabled = true
# Include the message text; chats that hide previews in Telegram never show it.
# show_preview = true
# A sound from the freedesktop sound theme played with them, e.g.
# "message-new-instant"; silent messages never play it. Empty for silence.
# sound = ""
# Daily hours without notifications, in local time; it may pass midnight.
# quiet_hours = "23:00-07:00"
# Clicking a notification opens its chat (on notification servers that
# support actions).
# open_on_click = true
# Show the number of unread messages in unmuted chats in the terminal's
# title, e.g. "tgt (3)".
# unread_in_title = false
# Which chats notify, with previews, mentions and pinned messages, are
# Telegram's own settings: leader N changes them for every device.

[privacy]
# Show you online while tgt runs. When off, others see your last seen time,
# as your privacy settings allow (leader P changes those).
# appear_online = true
# Tell chats when you're typing a message.
# send_typing = true

[media]
# Load the images shown under photos, videos and stickers in the chat without
# being asked. When off, only previews already downloaded are shown; opening
# or saving a file still downloads it.
# auto_download_previews = true
# Previews bigger than this (in MiB) aren't loaded automatically; 0 for no limit.
# max_preview_size_mb = 0
# At startup, trim the downloaded file cache to this size (in MiB); 0 keeps it all.
# cache_max_size_mb = 0
# At startup, delete cached files not used for this many days; 0 keeps them.
# cache_max_age_days = 0

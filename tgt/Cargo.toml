[package]
name = "tgt"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
description.workspace = true
keywords.workspace = true
repository.workspace = true

[lib]
name = "tgt"
path = "src/lib.rs"

[[bin]]
name = "tgt"
path = "src/main.rs"

[features]
default = ["keychain", "media-preview"]
# Keep the key of the encrypted TDLib database in the system keychain (Secret Service).
keychain = ["dep:keyring-core", "dep:dbus-secret-service-keyring-store", "dep:getrandom"]
# Image previews of photos, videos, GIFs and stickers in the media viewer.
media-preview = ["dep:image", "dep:ratatui-image"]

[dependencies]
libtgt = { path = "../libtgt", version = "1.0.0" }
arboard.workspace = true
clap.workspace = true
crossterm.workspace = true
dbus-secret-service-keyring-store = { workspace = true, optional = true }
futures.workspace = true
getrandom = { workspace = true, optional = true }
image = { workspace = true, optional = true }
keyring-core = { workspace = true, optional = true }
nucleo-matcher.workspace = true
ratatui.workspace = true
ratatui-explorer.workspace = true
ratatui-image = { workspace = true, optional = true }
serde.workspace = true
signal-hook.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tempfile.workspace = true

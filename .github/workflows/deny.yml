name: cargo-deny

# Daily too: new advisories are published without any push here.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check

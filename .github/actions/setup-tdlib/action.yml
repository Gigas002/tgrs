name: Setup TDLib
description: >
  Installs the system libraries tgrs links against and TDLib (tdjson), built
  from source at a pinned commit and cached per runner.

inputs:
  tdlib-commit:
    description: TDLib commit matching the tdlib-rs version in Cargo.lock.
    default: c15d3f5a5de6e3ba5839822c451152e5e18bb700

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential pkg-config \
          libdbus-1-dev \
          libc++1-18 libc++abi1-18

    - name: Restore TDLib
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.tdlib
        key: ${{ runner.os }}-${{ runner.arch }}-tdlib-${{ inputs.tdlib-commit }}

    - name: Build TDLib
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TDLIB_COMMIT: ${{ inputs.tdlib-commit }}
        PREFIX: ${{ github.workspace }}/.tdlib
      run: |
        sudo apt-get install -y -qq make git zlib1g-dev libssl-dev gperf php-cli cmake \
          clang-18 libc++-18-dev libc++abi-18-dev
        git clone https://github.com/tdlib/td.git "$RUNNER_TEMP/td"
        cd "$RUNNER_TEMP/td"
        git checkout "$TDLIB_COMMIT"
        mkdir -p build && cd build
        CXXFLAGS="-stdlib=libc++" CC=/usr/bin/clang-18 CXX=/usr/bin/clang++-18 \
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX:PATH="$PREFIX" ..
        cmake --build . --target install

    - name: Save TDLib
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.tdlib
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Expose TDLib to pkg-config and the loader
      shell: bash
      run: |
        echo "PKG_CONFIG_PATH=${{ github.workspace }}/.tdlib/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=${{ github.workspace }}/.tdlib/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
